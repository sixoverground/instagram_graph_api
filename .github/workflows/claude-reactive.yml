name: Claude Reactive

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status:

jobs:
  handle-copilot-review:
    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'copilot' &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 10
            });
            const twoHoursAgo = Date.now() - 2 * 60 * 60 * 1000;
            const recentClaude = comments.data.some(c =>
              c.body.includes('@claude') &&
              new Date(c.created_at).getTime() > twoHoursAgo
            );
            if (recentClaude) {
              console.log('Skipping — @claude was already tagged within the last 2 hours');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@claude Address all review comments on this PR. For each comment, either fix the code or explain why no change is needed.'
            });

  handle-ci-failure:
    if: >
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.check_suite.pull_requests;
            if (prs.length === 0) return;

            const pr = prs.find(p => p.head.ref.startsWith('claude/'));
            if (!pr) return;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 10
            });
            const twoHoursAgo = Date.now() - 2 * 60 * 60 * 1000;
            const recentClaude = comments.data.some(c =>
              c.body.includes('@claude') &&
              new Date(c.created_at).getTime() > twoHoursAgo
            );
            if (recentClaude) {
              console.log('Skipping — @claude was already tagged within the last 2 hours');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '@claude CI failed on this PR. Check the build/test logs, identify the failures, and push fixes.'
            });

  handle-status-failure:
    if: >
      github.event_name == 'status' &&
      (github.event.state == 'failure' || github.event.state == 'error')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Status events fire on every commit, not just PR commits.
            // Filter to claude/ branches before burning an API call.
            const claudeBranch = (context.payload.branches || []).find(b =>
              b.name.startsWith('claude/')
            );
            if (!claudeBranch) return;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.sha
            });
            const pr = prs.find(p =>
              p.head.ref === claudeBranch.name && p.state === 'open'
            );
            if (!pr) return;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 10
            });
            const twoHoursAgo = Date.now() - 2 * 60 * 60 * 1000;
            const recentClaude = comments.data.some(c =>
              c.body.includes('@claude') &&
              new Date(c.created_at).getTime() > twoHoursAgo
            );
            if (recentClaude) {
              console.log('Skipping — @claude was already tagged within the last 2 hours');
              return;
            }

            const ctx = context.payload.context;
            const targetUrl = context.payload.target_url;
            const description = context.payload.description || '';
            const linkLine = targetUrl ? `\nBuild logs: ${targetUrl}` : '';
            const descLine = description ? `\nReported: ${description}` : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `@claude CI failed on this PR (\`${ctx}\` reported \`${context.payload.state}\`). Check the logs, identify the failure, and push fixes.${descLine}${linkLine}`
            });
